<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>

    <title>Sentir | Administrativo</title>
</head>
<body>

<div class="container-fluid pantalla-inicio">
    <div class="container">
        <div class="logo-container">
            <img src="/Client/img/logo-sentir.png" alt="Logo Sentir" class="logo">
        </div>

        <div class="text-center mt-3">
            <h4 class="titulo">
                Entiende lo que <span style="color:#4e30c2;">sientes</span> y,<br> transforma tu <span style="color:#4E2FC7;">bienestar</span>.</br>
            </h4>
        </div>

        <div class="inicio-layout">
            <div class="personajes-container">
                <img src="/Client/img/personajes.png" alt="Personajes" class="personajes">
            </div>

            <div class="selector-container admin-selector-stack">
                <div class="select-wrapper admin-select-wrapper">
                    <select class="btn btn-login btn-select admin-select" aria-label="Selecciona tu rol">
                        <option value="" selected disabled>Selecciona tu rol</option>
                        <option value="secretaria">Secretaria</option>
                        <option value="rectora">Rectora</option>
                        <option value="coordinadora-academica">Coordinadora académica</option>
                        <option value="coordinadora-convivencia">Coordinadora convivencia</option>
                        <option value="docente">Docente</option>
                        <option value="psicologa">Psicóloga</option>
                        <option value="entorno-protector">Entorno protector</option>
                    </select>
                </div>

                <button class="btn btn-login admin-login-btn" id="openLoginModal">
                    Inicio de sesión
                </button>
            </div>
        </div>

        <div class="text-center mt-4 accesibilidad">
            <i class="fi fi-rr-universal-access"></i> Accesible para todos
        </div>
    </div>
</div>

<div class="modal-overlay" id="loginModal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
        <button class="modal-close" id="closeLoginModal" aria-label="Cerrar">×</button>
        <h3 id="loginModalTitle">Iniciar sesión</h3>

        <div class="modal-form">
            <label>
                Número de identificación
                <input type="text" placeholder="Ingrese su número de identificación">
            </label>

            <label>
                Contraseña
                <input type="password" placeholder="Ingrese su contraseña">
            </label>

            <button class="btn btn-login modal-submit" id="loginSubmitBtn">
                Entrar
            </button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
