<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>



    <title>Sentir</title>
    <link rel="stylesheet" href="responsive.css">
</head>

<body>

    <div class="container-fluid pantalla-inicio">

        <div class="container">
            <!-- Logo -->
            <div class="logo-container">
                <a href="./index.html" aria-label="Ir al inicio" title="Ir al inicio">
                    <img src="/Client/img/logo-sentir.png" alt="Logo Sentir" class="logo">
                </a>
            </div>

            <!-- Texto -->
            <div class="text-center mt-3">
                <h4 class="titulo">
                    Entiende lo que <span style="color:#4e30c2;">sientes</span> y,<br> transforma tu <span
                        style="color:#4E2FC7;">bienestar</span>.</br>
                </h4>
            </div>

            <div class="inicio-layout">
                <!-- Personajes -->
                <div class="personajes-container">
                    <img src="/Client/img/personajes.png" alt="Personajes" class="personajes" fetchpriority="high" decoding="async">
                </div>

                <!-- Selector de perfil -->
                <div class="selector-container">
                    <div class="select-wrapper">
                        <select class="btn btn-login btn-select" aria-label="Selecciona tu perfil">
                            <option value="" selected disabled>Selecciona tu perfil</option>
                            <option value="estudiante">Estudiante</option>
                            <option value="administrativo">Administrativo</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Accesibilidad -->
            <div class="text-center mt-4 accesibilidad">
                <i class="fi fi-rr-universal-access"></i> Accesible para todos
            </div>
        </div>

    </div>
    <script src="script.js"></script>

</body>

</html>
